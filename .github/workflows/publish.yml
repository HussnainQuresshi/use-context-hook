name: Publish to npm

# Trigger on version tags (e.g., v2.0.6, v3.0.0-beta.1)
on:
  push:
    tags:
      - 'v*.*.*'

# Required permissions for npm Trusted Publishing (OIDC)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Configure npm registry for Trusted Publishing (OIDC)
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run tsc-test

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
